global:
  scrape_interval: 15s


rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'laravel_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx:80']




  - job_name: 'laravel_app1'
    metrics_path: '/metrics-app1'
    static_configs:
      - targets: ['nginx:80']
        labels:
          app_instance: 'fiberroad-app1'

  - job_name: 'laravel_app2'
    metrics_path: '/metrics-app2'
    static_configs:
      - targets: ['nginx:80']
        labels:
          app_instance: 'fiberroad-app2'

  - job_name: 'laravel_app3'
    metrics_path: '/metrics-app3'
    static_configs:
      - targets: ['nginx:80']
        labels:
          app_instance: 'fiberroad-app3'
