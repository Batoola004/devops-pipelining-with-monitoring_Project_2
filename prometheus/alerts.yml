groups:
  - name: laravel_app_alerts
    interval: 30s
    rules:


      - alert: HighResponseTime
        expr: avg(laravel_app_response_time_ms) > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Average response time exceeds 500ms"
          description: "The average response time for the Laravel app is {{ $value }}ms (threshold: 500ms)."

      - alert: CriticalResponseTime
        expr: avg(laravel_app_response_time_ms) > 1000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical response time — above 1000ms"
          description: "The average response time is {{ $value }}ms. Immediate investigation required."

      - alert: HighP95Latency
        expr: avg(laravel_app_response_time_p95_ms) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 response time exceeds 1000ms"
          description: "p95 latency is {{ $value }}ms — slow requests affecting top 5% of users."


      - alert: HighErrorRate
        expr: avg(laravel_app_error_rate_percent) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5%"
          description: "The application error rate is {{ $value }}% (threshold: 5%)."

      - alert: CriticalErrorRate
        expr: avg(laravel_app_error_rate_percent) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate — above 10%"
          description: "The application error rate is {{ $value }}%. Immediate action required."


      - alert: InstanceDown
        expr: count(laravel_app_instance) < 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Application instance is down"
          description: "Only {{ $value }} instance(s) are running (expected: 3). Load balancing capacity reduced."

      - alert: AllInstancesDown
        expr: count(laravel_app_instance) == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "ALL application instances are DOWN"
          description: "No Laravel instances are serving requests. Service is unavailable."


      - alert: InstanceRecentlyRestarted
        expr: avg(laravel_app_uptime_seconds) < 300
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Instance recently restarted"
          description: "Average uptime is {{ $value }}s — less than 5 minutes. Possible deployment or crash."


      - alert: StorageRunningLow
        expr: avg(laravel_app_storage_used_percent) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Storage usage above 80%"
          description: "Storage is at {{ $value }}% capacity. Clean up or expand disk soon."

      - alert: StorageCritical
        expr: avg(laravel_app_storage_used_percent) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Storage usage above 90%"
          description: "Storage is at {{ $value }}% capacity. Immediate cleanup required."


      - alert: HighMemoryUsage
        expr: avg(laravel_app_memory_bytes) > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage exceeds 100MB per instance"
          description: "Average memory usage is {{ $value | humanize1024 }}. Consider scaling or optimizing."


      - alert: LowCacheHitRatio
        expr: avg(laravel_app_cache_hit_ratio_percent) < 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit ratio below 50%"
          description: "Cache hit ratio is {{ $value }}%. Caching strategy may need improvement."


      - alert: DatabaseDown
        expr: laravel_app_database_up == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Database connection lost"
          description: "The database is unreachable. Check MySQL container and credentials."


      - alert: QueueGrowing
        expr: avg(laravel_app_queue_size) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue size growing — over 100 pending jobs"
          description: "Queue has {{ $value }} pending jobs. Horizon workers may need scaling."

      - alert: QueueCritical
        expr: avg(laravel_app_queue_size) > 500
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Queue backlog critical — over 500 pending jobs"
          description: "Queue has {{ $value }} pending jobs. Immediate action required."


      - alert: UnbalancedTraffic
        expr: stddev by (instance) (laravel_app_requests_total) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unbalanced traffic distribution across instances"
          description: "Traffic distribution stddev is {{ $value }} — instances may be receiving uneven load."


      - alert: FiveXXSpike
        expr: rate(laravel_app_http_requests_by_status{status_group="5xx"}[5m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Spike in 5xx errors"
          description: "5xx error rate is {{ $value }} errors/sec. Possibly a deployment issue or bug."
