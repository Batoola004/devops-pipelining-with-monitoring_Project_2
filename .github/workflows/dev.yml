name: Development Build & Test (6 Services - Prometheus + Grafana Included)

on:
  push:
    branches: ["dev", "develop", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

env:
  DOCKER_IMAGE_NAME: batool004ma/laravel-app
  IMAGE_NAME: batool004ma/laravel-app:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: PHP Syntax Check (lint)
        run: |
          set -e
          errors=$(find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -exec php -l {} \; 2>&1 | grep -v "^No syntax errors" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "All PHP files passed syntax check."

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

  frontend:
    name: Frontend Build (npm ci + vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 || echo "TypeScript errors found (non-blocking warning)"

      - name: Build frontend assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify vendor/autoloader inside built image
        run: |
          set -e
          echo ">>> Checking Laravel framework class is present..."
          if ! docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest \
              test -f /var/www/vendor/laravel/framework/src/Illuminate/Foundation/Application.php; then
            echo "::error::Illuminate/Foundation/Application.php missing from image vendor/ - composer install in the build stage did not produce a usable vendor directory"
            exit 1
          fi
          echo "Framework class file found."

          echo ">>> Checking autoload.php exists and is non-trivial..."
          autoload_size=$(docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest stat -c%s /var/www/vendor/autoload.php 2>/dev/null || echo 0)
          echo "autoload.php size: $autoload_size bytes"
          if [ "$autoload_size" -lt 200 ]; then
            echo "::error::vendor/autoload.php is missing or suspiciously small ($autoload_size bytes)"
            exit 1
          fi

          echo ">>> Sanity-checking artisan can resolve the framework class..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest \
            php -r "require '/var/www/vendor/autoload.php'; var_dump(class_exists('Illuminate\Foundation\Application'));"

      - name: Save image as artifact for downstream job
        run: docker save ${{ env.DOCKER_IMAGE_NAME }}:latest -o /tmp/app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/app-image.tar
          retention-days: 1

  integration-test:
    name: Integration Test (6 Services)
    runs-on: ubuntu-latest
    needs: build
    env:
      APP_KEY: base64:$(openssl rand -base64 32)
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      DB_ROOT_PASSWORD: root_secret
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/app-image.tar

      - name: Generate a real APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start all 6 services
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for all services to report healthy
        run: |
          set -e
          services="fiberroad-mysql fiberroad-redis fiberroad-app fiberroad-nginx fiberroad-prometheus fiberroad-grafana"
          deadline=$((SECONDS + 180))
          for svc in $services; do
            echo ">>> Waiting for $svc to become healthy..."
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null)" = "healthy" ]; do
              if [ $SECONDS -ge $deadline ]; then
                echo "::error::$svc did not become healthy in time"
                echo "---- docker compose ps ----"
                docker compose -f docker-compose.dev.yml ps
                echo "---- logs: $svc ----"
                docker logs "$svc" --tail 200 || true
                exit 1
              fi
              sleep 5
            done
            echo "$svc is healthy."
          done

      - name: Smoke test HTTP through nginx
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/up || echo "000")
          echo "HTTP /up status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200 from /up, got $status"
            docker logs fiberroad-nginx --tail 100 || true
            docker logs fiberroad-app --tail 100 || true
            exit 1
          fi

      - name: Verify Prometheus targets are up
        run: |
          targets=$(curl -s http://localhost:9090/api/v1/targets)
          up_count=$(echo "$targets" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('data',{}).get('activeTargets',[]); print(sum(1 for x in t if x.get('health')=='up'))")
          echo "Prometheus active targets (UP): $up_count"
          if [ "$up_count" -lt 1 ]; then
            echo "::error::No Prometheus targets are UP"
            exit 1
          fi

      - name: Verify Grafana is reachable
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          echo "Grafana /api/health status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Grafana not healthy (HTTP $status)"
            docker logs fiberroad-grafana --tail 100 || true
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=200

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
