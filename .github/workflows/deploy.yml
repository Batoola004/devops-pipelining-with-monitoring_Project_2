name: Production Build and Deploy to Azure VM

on:
  push:
    branches: ["main"]

env:
  DOCKER_IMAGE_NAME: mtaher3toani/laravel-app

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: PHP Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: PHP Syntax Check
        run: |
          set -e
          errors=$(find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -exec php -l {} \; 2>&1 | grep -v "^No syntax errors" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "All PHP files passed syntax check."

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image (load locally for verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify vendor/autoloader inside built image
        run: |
          set -e
          echo ">>> Checking Laravel framework class is present..."
          if ! docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
              test -f /var/www/vendor/laravel/framework/src/Illuminate/Foundation/Application.php; then
            echo "::error::Illuminate/Foundation/Application.php missing from image vendor/ - composer install in the build stage did not produce a usable vendor directory"
            exit 1
          fi
          echo "Framework class file found."

          echo ">>> Checking autoload.php exists and is non-trivial..."
          autoload_size=$(docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} stat -c%s /var/www/vendor/autoload.php 2>/dev/null || echo 0)
          echo "autoload.php size: $autoload_size bytes"
          if [ "$autoload_size" -lt 200 ]; then
            echo "::error::vendor/autoload.php is missing or suspiciously small ($autoload_size bytes)"
            exit 1
          fi

          echo ">>> Sanity-checking artisan can resolve the framework class..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            php -r "require '/var/www/vendor/autoload.php'; if (!class_exists('Illuminate\Foundation\Application')) { fwrite(STDERR, 'Framework class not resolvable via autoloader' . PHP_EOL); exit(1); } echo 'OK' . PHP_EOL;"

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/laravel-app

            echo ">>> Recording current 'latest' image digest for possible rollback..."
            PREVIOUS_DIGEST=$(docker inspect --format='{{.Id}}' ${{ env.DOCKER_IMAGE_NAME }}:latest 2>/dev/null || echo "none")
            echo "Previous image ID: $PREVIOUS_DIGEST"

            echo ">>> Pulling new image..."
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest

            echo ">>> Recreating containers..."
            docker compose -f docker-compose.yml up -d --force-recreate --remove-orphans

            echo ">>> Waiting for app to be healthy..."
            DEPLOY_OK=false
            for i in $(seq 1 12); do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "Health check passed: HTTP 200"
                DEPLOY_OK=true
                break
              fi
              echo "Attempt $i: HTTP $status - waiting..."
              sleep 10
            done

            if [ "$DEPLOY_OK" != "true" ]; then
              echo "::error::Health check failed after 12 attempts."
              if [ "$PREVIOUS_DIGEST" != "none" ]; then
                echo ">>> Rolling back to previous image..."
                docker tag "$PREVIOUS_DIGEST" ${{ env.DOCKER_IMAGE_NAME }}:latest
                docker compose -f docker-compose.yml up -d --force-recreate --remove-orphans
                echo ">>> Rollback complete. Deploy of ${{ github.sha }} was reverted."
              else
                echo "::warning::No previous image found, nothing to roll back to."
              fi
              echo ">>> Dumping logs for diagnosis..."
              docker compose -f docker-compose.yml logs --tail=200
              exit 1
            fi

            echo ">>> Pruning old, unused images..."
            docker image prune -f

            echo ">>> Deploy of ${{ github.sha }} succeeded."
