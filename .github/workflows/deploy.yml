name: Production Build and Deploy to Azure VM

on:
  push:
    branches: ["main"]

env:
  DOCKER_IMAGE_NAME: mtaher3toani/laravel-app

jobs:
  quality:
    name: PHP Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP Syntax Check
        run: |
          errors=$(find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -exec php -l {} \; 2>&1 | grep -v "^No syntax errors" || true)
          if [ -n "$errors" ]; then echo "$errors"; exit 1; fi
          echo "All PHP files passed syntax check."

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            cd /opt/laravel-app
            docker compose -f docker-compose.yml down
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest
            docker compose -f docker-compose.yml up -d --force-recreate
            docker image prune -f
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 12); do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "Health check passed: HTTP 200"
                exit 0
              fi
              echo "Attempt $i: HTTP $status - waiting..."
              sleep 10
            done
            echo "Health check failed after 12 attempts."
            exit 1
