name: Production Build and Deploy to AWS VM

on:
  push:
    branches: ["main"]

concurrency:
  group: fiberroad-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: batool004ma/laravel-app

jobs:
  quality:
    name: PHP Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP Syntax Check
        run: |
          errors=$(find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -exec php -l {} \; 2>&1 | grep -v "^No syntax errors" || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "All PHP files passed syntax check."

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy via restricted SSH account and verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            sudo -n /usr/local/sbin/fiberroad-ci-deploy ${{ github.sha }}
