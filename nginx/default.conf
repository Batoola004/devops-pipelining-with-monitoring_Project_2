upstream laravel_backend {
    server app1:9000 max_fails=3 fail_timeout=10s;
    server app2:9000 max_fails=3 fail_timeout=10s;
    server app3:9000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;


    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s;

    charset utf-8;


    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;


    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }


    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }


    location ~ ^/(storage/app/public|storage/framework|storage/logs|bootstrap/cache|vendor|resources|database) {
        deny all;
        access_log off;
        log_not_found off;
    }


    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }


    location = /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        deny all;
    }





    location = /metrics-app1 {
        rewrite ^ /metrics break;
        fastcgi_pass app1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param REQUEST_URI /metrics;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 10;
    }

    location = /metrics-app2 {
        rewrite ^ /metrics break;
        fastcgi_pass app2:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param REQUEST_URI /metrics;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 10;
    }

    location = /metrics-app3 {
        rewrite ^ /metrics break;
        fastcgi_pass app3:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param REQUEST_URI /metrics;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 10;
    }


    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass laravel_backend;
        fastcgi_read_timeout 60;


        add_header X-Upstream $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
    }


    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;
}
